name: Emulator test

# Starts an Android emulator, runs the tests in app/src/androidTest,
# then opens the app and saves a screenshot and the crash log.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Enable KVM (hardware speed-up for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb logcat -c
            gradle connectedDebugAndroidTest --no-daemon --stacktrace || (adb logcat -d > logcat.txt; exit 1)
            adb logcat -d -s OCR_TEST:I > ocr-output.txt
            gradle installDebug --no-daemon
            adb shell pm grant app.screentotext android.permission.CAMERA
            adb shell am start -W -n app.screentotext/.MainActivity | tee start.txt
            if grep -q "Error" start.txt; then echo "App did not start"; exit 1; fi
            sleep 8
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | tee resumed.txt
            if ! grep -q "app.screentotext" resumed.txt; then echo "App is not in the foreground"; adb logcat -d | grep -A30 "FATAL EXCEPTION"; exit 1; fi
            adb exec-out screencap -p > screenshot.png
            adb logcat -d > logcat.txt
            cat ocr-output.txt
            echo "SCREENSHOT_BASE64_START"; base64 -w0 screenshot.png; echo; echo "SCREENSHOT_BASE64_END"
            if grep -q "FATAL EXCEPTION" logcat.txt; then echo "App crashed"; grep -A30 "FATAL EXCEPTION" logcat.txt; exit 1; fi

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            screenshot.png
            ocr-output.txt
            logcat.txt
            app/build/reports/androidTests/
          if-no-files-found: ignore
